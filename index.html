  <style>

      align-items: center;

      display: flex;

      color: var(--text-main);

      background: #f8fafc;
      border-color: #94a3b8;

      align-items: center;
      gap: 6px;
      margin-left: auto;
      font-size: 0.85rem;
      color: var(--text-muted);

      border: 1px solid var(--border-color);

      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 12px;
    }

      display: inline-block;

      height: 1.2em;
      background-color: var(--primary);
      vertical-align: middle;
      animation: blink 0.8s infinite;
      margin-left: 2px;

      top: 16px;
      right: 18px;

      border-radius: 8px;
      padding: 20px;

      margin-top: 6px;

      border: 1px solid #a7f3d0;

      font-size: 0.8rem;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

</div>

// Audio Synthesizer using Web Audio API (Native, no external files)
class SoundFX {
  constructor() {
    this.ctx = null;
  }
  init() {
    if (!this.ctx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) this.ctx = new AudioContext();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }
  playKey() {
    if (!this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(600 + Math.random() * 250, this.ctx.currentTime);
      gain.gain.setValueAtTime(0.015, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.04);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.04);
    } catch(e) {}
  }
  playReveal() {
    if (!this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(440, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.25);
      gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.3);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.3);
    } catch(e) {}
  }
}

const sfx = new SoundFX();

// DOM elements
const storySelect = document.getElementById('storySelect');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const randomBtn = document.getElementById('randomBtn');
const speedSelect = document.getElementById('speedSelect');
const skipBtn = document.getElementById('skipBtn');
const storyTitleEl = document.getElementById('storyTitle');
const storyContentEl = document.getElementById('storyContent');
const typeCursor = document.getElementById('typeCursor');
const currentNumberText = document.getElementById('currentNumberText');
const wordCountLabel = document.getElementById('wordCountLabel');

const interactiveSection = document.getElementById('interactiveSection');
const questionTextEl = document.getElementById('questionText');
const timerContainer = document.getElementById('timerContainer');
const timerBar = document.getElementById('timerBar');
const timerCountdown = document.getElementById('timerCountdown');
const answerBox = document.getElementById('answerBox');
const answerTextEl = document.getElementById('answerText');
const vocabBox = document.getElementById('vocabBox');

let currentStoryIndex = 0;
let typewriterTimeout = null;
let countdownInterval = null;
let isTyping = false;

// Populate dropdown selector
stories.forEach((s, idx) => {
  const opt = document.createElement('option');
  opt.value = idx;
  opt.textContent = s.title;
  storySelect.appendChild(opt);
});

function loadStory(index) {
  clearTimeout(typewriterTimeout);
  clearInterval(countdownInterval);

  currentStoryIndex = index;
  storySelect.value = index;
  currentNumberText.textContent = index + 1;

  const story = stories[index];
  storyTitleEl.textContent = story.title;
  storyContentEl.textContent = '';
  typeCursor.classList.remove('hidden');

  interactiveSection.style.display = 'none';
  answerBox.style.display = 'none';
  timerContainer.style.display = 'block';

  // Count exact words
  const count = story.text.trim().split(/\s+/).length;
  wordCountLabel.textContent = `${count} words`;

  // Start Typewriter effect
  isTyping = true;
  let charIdx = 0;
  const fullText = story.text;

  function typeChar() {
    if (!isTyping) return;
    const speed = parseInt(speedSelect.value, 10);

    if (charIdx < fullText.length) {
      storyContentEl.textContent += fullText.charAt(charIdx);
      if (charIdx % 3 === 0 && fullText.charAt(charIdx) !== ' ') {
        sfx.playKey();
      }
      charIdx++;
      typewriterTimeout = setTimeout(typeChar, speed);
    } else {
      finishTyping();
    }
  }

  typeChar();
}

function finishTyping() {
  clearTimeout(typewriterTimeout);
  isTyping = false;
  storyContentEl.textContent = stories[currentStoryIndex].text;
  typeCursor.classList.add('hidden');
  startQuestionCountdown();
}

function startQuestionCountdown() {
  const story = stories[currentStoryIndex];
  questionTextEl.textContent = story.question;
  interactiveSection.style.display = 'block';
  interactiveSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

  // 5 seconds timer
  let remainingSeconds = 5;
  timerCountdown.textContent = `${remainingSeconds}s`;
  timerBar.style.transition = 'none';
  timerBar.style.width = '100%';

  setTimeout(() => {
    timerBar.style.transition = 'width 5s linear';
    timerBar.style.width = '0%';
  }, 50);

  countdownInterval = setInterval(() => {
    remainingSeconds--;
    if (remainingSeconds > 0) {
      timerCountdown.textContent = `${remainingSeconds}s`;
    } else {
      clearInterval(countdownInterval);
      showAnswer();
    }
  }, 1000);
}

function showAnswer() {
  clearInterval(countdownInterval);
  timerContainer.style.display = 'none';
  sfx.playReveal();

  const story = stories[currentStoryIndex];
  answerTextEl.textContent = story.answer;

  vocabBox.innerHTML = '';
  story.vocab.forEach(v => {
    const pill = document.createElement('span');
    pill.className = 'vocab-pill';
    pill.textContent = v;
    vocabBox.appendChild(pill);
  });

  answerBox.style.display = 'block';
}

// Event Listeners
storySelect.addEventListener('change', (e) => {
  sfx.init();
  loadStory(parseInt(e.target.value, 10));
});

prevBtn.addEventListener('click', () => {
  sfx.init();
  const nextIdx = (currentStoryIndex - 1 + stories.length) % stories.length;
  loadStory(nextIdx);
});

nextBtn.addEventListener('click', () => {
  sfx.init();
  const nextIdx = (currentStoryIndex + 1) % stories.length;
  loadStory(nextIdx);
});

randomBtn.addEventListener('click', () => {
  sfx.init();
  let r = Math.floor(Math.random() * stories.length);
  if (r === currentStoryIndex) r = (r + 1) % stories.length;
  loadStory(r);
});

skipBtn.addEventListener('click', () => {
  sfx.init();
  if (isTyping) finishTyping();
});

document.addEventListener('click', () => sfx.init(), { once: true });

// Initial load
loadStory(0);
</script>
